# -*- coding: utf-8 -*-
[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv310
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pylint]
disable = [
    "C0413",
    "C0415",
    "C0301",
    "W0718",
    "W0611",
    "W0621",
    "W0404",
    "R1705"
]
max-line-length = 100

[tool.pylint.messages_control]
# 为 .pyi 类型存根文件禁用特定检查
disable-pyi = [
    "W0613",  # unused-argument
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
    "W0107",  # unnecessary-pass
    "R0903"   # too-few-public-methods
]

[tool.flake8]
max-line-length = 100
ignore = [
    "E402",
    "D400",
    "I100",
    "E501",
    "W503"
]
extend-ignore = [
    "E402",
    "D400",
    "I100",
    "E501",
    "W503"
]

[tool.pycodestyle]
max-line-length = 100

[tool.autopep8]
max-line-length = 100

