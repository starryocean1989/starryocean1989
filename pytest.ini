# -*- coding: utf-8 -*-
[pytest]
# pytest配置文件

# 测试目录
testpaths = tests

# 测试文件模式
python_files = test_*.py

# 测试类模式
python_classes = Test*

# 测试函数模式
python_functions = test_*

# 命令行选项
addopts =
    -v
    --strict-markers
    --tb=short
    --maxfail=1
    -p no:warnings
    --color=yes

# 标记定义
markers =
    e2e: 端到端测试(E2E)
    ui: UI集成测试
    system_manager: 系统管理界面测试
    data_center: 数据中心界面测试
    market_board: 行情看板界面测试
    strategy_center: 策略中心界面测试
    trading_gateway: 交易网关界面测试
    portfolio: 组合投资界面测试
    slow: 慢速测试
    integration: 集成测试
    timeout: 超时控制（pytest-timeout）
    loop: 功能回路测试

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 最小Python版本
minversion = 7.0

# 异步测试支持
asyncio_mode = auto

