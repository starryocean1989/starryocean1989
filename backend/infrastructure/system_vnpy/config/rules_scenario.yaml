# 场景规则（按具体业务场景定制，最高优先级）

# 场景: 品种列表重新加载（用户主动触发）
scenario_reload_symbols:
  description: "重新加载品种列表"
  duration: "5-10s"
  trigger: "用户点击刷新按钮"
  SYSTEM:
    INFO: [file, console, statusbar]
  PROGRESS:
    INFO: [file, statusbar]  # 加载进度显示在状态栏
  NOTIFICATION:
    INFO: [file, console, statusbar, event]
  ALERT:
    WARNING: [file, statusbar]

# 场景: K线批量下载（15000任务，高频）
scenario_bulk_download:
  description: "K线批量下载"
  duration: "1-3min"
  frequency: "300条/秒"
  PROGRESS:
    INFO: [file, event_throttled]  # 严格节流，不输出控制台
  NOTIFICATION:
    INFO: [file, statusbar, event]
  ALERT:
    WARNING: [file, statusbar]
    ERROR: [file, console, statusbar, ui_dialog]

# 场景: 数据质量扫描（5000品种）
scenario_quality_scan:
  description: "数据质量扫描"
  duration: "30-60s"
  PROGRESS:
    INFO: [file, event_throttled, statusbar]
  ALERT:
    WARNING: [file, database, statusbar]  # 质量问题入库
    ERROR: [file, database, statusbar, ui_dialog]
  NOTIFICATION:
    INFO: [file, statusbar, event]

# 场景: 策略回测
scenario_backtest_run:
  description: "策略回测运行"
  duration: "1-5min"
  PROGRESS:
    INFO: [file, event_throttled, statusbar]
  SYSTEM:
    INFO: [file]  # 回测明细仅文件
    WARNING: [file, console, event]
    ERROR: [file, console, database, event]
  NOTIFICATION:
    INFO: [file, statusbar, ui_dialog]  # 回测完成弹窗
  ALERT:
    WARNING: [file, statusbar]

# 场景: 策略实盘执行
scenario_strategy_live:
  description: "策略实盘执行"
  duration: "持续"
  priority: critical
  SYSTEM:
    INFO: [file, database]  # 所有信号/订单入库
    WARNING: [file, database, event]
    ERROR: [file, database, ui_dialog, event]
  ALERT:
    WARNING: [file, database, statusbar, event]
    ERROR: [file, database, statusbar, ui_dialog, event, email]
    CRITICAL: [file, database, statusbar, ui_dialog, event, email, sms]
  NOTIFICATION:
    INFO: [file, database, statusbar]

# 场景: 订单执行
scenario_order_execution:
  description: "订单提交和执行"
  duration: "实时"
  priority: critical
  SYSTEM:
    INFO: [file, database]  # 订单全生命周期入库
    WARNING: [file, database, statusbar, event]
    ERROR: [file, database, statusbar, ui_dialog, event]
  ALERT:
    WARNING: [file, database, statusbar, event]
    ERROR: [file, database, statusbar, ui_dialog, event, email]
    CRITICAL: [file, database, statusbar, ui_dialog, event, email, sms]

# 场景: 用户配置修改
scenario_config_change:
  description: "用户修改系统配置"
  duration: "即时"
  USER_FEEDBACK:
    INFO: [statusbar]
  SYSTEM:
    INFO: [file, database]  # 配置变更入库（审计）
    ERROR: [ui_dialog]
  NOTIFICATION:
    INFO: [statusbar]

# 场景: 异常恢复
scenario_error_recovery:
  description: "系统异常恢复"
  duration: "1-5s"
  SYSTEM:
    WARNING: [file, console, database, event]
    ERROR: [file, console, database, ui_dialog, event]
    CRITICAL: [file, console, database, ui_dialog, event, email]
  ALERT:
    WARNING: [file, database, statusbar, event]
    ERROR: [file, database, statusbar, ui_dialog, event, email]

# 场景: 网络连接重试
scenario_connection_retry:
  description: "网络连接重试"
  duration: "持续"
  SYSTEM:
    WARNING: [file, statusbar]
    ERROR: [file, statusbar, ui_dialog]
  ALERT:
    WARNING: [file, statusbar]

# 场景: 数据库维护
scenario_database_maintenance:
  description: "数据库维护（清理/备份）"
  duration: "30-60s"
  SYSTEM:
    INFO: [file, console]
    WARNING: [file, console]
    ERROR: [file, console, ui_dialog]
  NOTIFICATION:
    INFO: [file, statusbar]

# 场景: 网络测速（调试专用）
scenario_network_speedtest:
  description: "网络带宽和延迟测速"
  duration: "2-60s"
  trigger: "用户点击测速按钮或自动定期测试"
  DEBUG:
    INFO: [file, ai_file]  # 详细调试信息输出到 logs/ai/network_speedtest_YYYYMMDD.log
    WARNING: [file, ai_file]
    ERROR: [file, ai_file, console]
  SYSTEM:
    INFO: [file, ai_file]
    WARNING: [file, ai_file, console]
    ERROR: [file, ai_file, console, statusbar]
  NOTIFICATION:
    INFO: [file, statusbar]
  ALERT:
    WARNING: [file, statusbar]
    ERROR: [file, statusbar, ui_dialog]

# 场景: 手动测速（用户手动触发）
scenario_manual_speedtest:
  description: "用户手动触发的网络测速任务"
  SYSTEM:
    DEBUG: [file, ai_file]  # ✅ 只输出到文件和AI日志
    INFO: [file, ai_file]    # ✅ 只输出到文件和AI日志
    WARNING: [file, console, database, event, ai_file]  # ✅ 输出到Terminal
    ERROR: [file, console, database, event, ai_file]    # ✅ 输出到Terminal
    CRITICAL: [file, console, database, event, ui_dialog, ai_file]  # ✅ 输出到Terminal并弹窗
  STAGE_NODE:  # 🆕 流程节点
    DEBUG: [file, ai_file]  # ✅ 只输出到文件和AI日志
    INFO: [file, console, ai_file]  # ✅ 阶段节点输出到Terminal
    WARNING: [file, console, database, event, ai_file]
    ERROR: [file, console, database, event, ai_file]

# 场景: TDX数据读取（从通达信数据源读取数据）
scenario_tdx_data_read:
  description: "从通达信数据源读取数据"
  SYSTEM:
    DEBUG: [file, ai_file]
    INFO: [file, ai_file]
    WARNING: [file, console, database, event, ai_file]
    ERROR: [file, console, database, event, ai_file]
    CRITICAL: [file, console, database, event, ui_dialog, ai_file]
  STAGE_NODE:
    DEBUG: [file, ai_file]
    INFO: [file, console, ai_file]
    WARNING: [file, console, database, event, ai_file]
    ERROR: [file, console, database, event, ai_file]

# 场景: 重新请求品种列表（重新从数据源获取品种列表）
scenario_refresh_symbol_list:
  description: "重新从数据源获取品种列表"
  SYSTEM:
    DEBUG: [file, ai_file]
    INFO: [file, ai_file]
    WARNING: [file, console, database, event, ai_file]
    ERROR: [file, console, database, event, ai_file]
    CRITICAL: [file, console, database, event, ui_dialog, ai_file]
  STAGE_NODE:
    DEBUG: [file, ai_file]
    INFO: [file, console, ai_file]
    WARNING: [file, console, database, event, ai_file]
    ERROR: [file, console, database, event, ai_file]

# 场景: 数据下载（批量下载市场数据）
scenario_data_download:
  description: "批量下载市场数据"
  SYSTEM:
    DEBUG: [file, ai_file]
    INFO: [file, ai_file]
    WARNING: [file, console, database, event, ai_file]
    ERROR: [file, console, database, event, ai_file]
    CRITICAL: [file, console, database, event, ui_dialog, ai_file]
  STAGE_NODE:
    DEBUG: [file, ai_file]
    INFO: [file, console, ai_file]
    WARNING: [file, console, database, event, ai_file]
    ERROR: [file, console, database, event, ai_file]

# 场景: 手动数据扫描（用户手动触发的数据质量扫描）
scenario_manual_data_scan:
  description: "用户手动触发的数据质量扫描"
  SYSTEM:
    DEBUG: [file, ai_file]
    INFO: [file, ai_file]
    WARNING: [file, console, database, event, ai_file]
    ERROR: [file, console, database, event, ai_file]
    CRITICAL: [file, console, database, event, ui_dialog, ai_file]
  STAGE_NODE:
    DEBUG: [file, ai_file]
    INFO: [file, console, ai_file]
    WARNING: [file, console, database, event, ai_file]
    ERROR: [file, console, database, event, ai_file]

# 场景: 应用启动（系统启动流程）
scenario_application_startup:
  description: "系统启动和初始化流程"
  SYSTEM:
    DEBUG: [file, ai_file]  # ✅ 只输出到文件和AI日志
    INFO: [file, ai_file]    # ✅ 只输出到文件和AI日志
    WARNING: [file, console, database, event, ai_file]  # ✅ 输出到Terminal
    ERROR: [file, console, database, event, ai_file]    # ✅ 输出到Terminal
    CRITICAL: [file, console, database, event, ui_dialog, ai_file]  # ✅ 输出到Terminal并弹窗
  STAGE_NODE:  # 🆕 流程节点
    DEBUG: [file, ai_file]  # ✅ 只输出到文件和AI日志
    INFO: [file, console, ai_file]  # ✅ 阶段节点输出到Terminal
    WARNING: [file, console, database, event, ai_file]
    ERROR: [file, console, database, event, ai_file]

