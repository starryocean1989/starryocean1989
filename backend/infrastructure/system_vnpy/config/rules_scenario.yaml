# 场景规则（按具体业务场景定制，最高优先级）

# 场景: 品种列表重新加载（用户主动触发）
scenario_reload_symbols:
  description: "重新加载品种列表"
  duration: "5-10s"
  trigger: "用户点击刷新按钮"
  SYSTEM:
    INFO: [file, console, statusbar]
  PROGRESS:
    INFO: [file, statusbar]  # 加载进度显示在状态栏
  NOTIFICATION:
    INFO: [file, console, statusbar, event]
  ALERT:
    WARNING: [file, statusbar]

# 场景: K线批量下载（15000任务，高频）
scenario_bulk_download:
  description: "K线批量下载"
  duration: "1-3min"
  frequency: "300条/秒"
  PROGRESS:
    INFO: [file, event_throttled]  # 严格节流，不输出控制台
  NOTIFICATION:
    INFO: [file, statusbar, event]
  ALERT:
    WARNING: [file, statusbar]
    ERROR: [file, console, statusbar, ui_dialog]

# 场景: 数据质量扫描（5000品种）
scenario_quality_scan:
  description: "数据质量扫描"
  duration: "30-60s"
  PROGRESS:
    INFO: [file, event_throttled, statusbar]
  ALERT:
    WARNING: [file, database, statusbar]  # 质量问题入库
    ERROR: [file, database, statusbar, ui_dialog]
  NOTIFICATION:
    INFO: [file, statusbar, event]

# 场景: 策略回测
scenario_backtest_run:
  description: "策略回测运行"
  duration: "1-5min"
  PROGRESS:
    INFO: [file, event_throttled, statusbar]
  SYSTEM:
    INFO: [file]  # 回测明细仅文件
    WARNING: [file, console, event]
    ERROR: [file, console, database, event]
  NOTIFICATION:
    INFO: [file, statusbar, ui_dialog]  # 回测完成弹窗
  ALERT:
    WARNING: [file, statusbar]

# 场景: 策略实盘执行
scenario_strategy_live:
  description: "策略实盘执行"
  duration: "持续"
  priority: critical
  SYSTEM:
    INFO: [file, database]  # 所有信号/订单入库
    WARNING: [file, database, event]
    ERROR: [file, database, ui_dialog, event]
  ALERT:
    WARNING: [file, database, statusbar, event]
    ERROR: [file, database, statusbar, ui_dialog, event, email]
    CRITICAL: [file, database, statusbar, ui_dialog, event, email, sms]
  NOTIFICATION:
    INFO: [file, database, statusbar]

# 场景: 订单执行
scenario_order_execution:
  description: "订单提交和执行"
  duration: "实时"
  priority: critical
  SYSTEM:
    INFO: [file, database]  # 订单全生命周期入库
    WARNING: [file, database, statusbar, event]
    ERROR: [file, database, statusbar, ui_dialog, event]
  ALERT:
    WARNING: [file, database, statusbar, event]
    ERROR: [file, database, statusbar, ui_dialog, event, email]
    CRITICAL: [file, database, statusbar, ui_dialog, event, email, sms]

# 场景: 用户配置修改
scenario_config_change:
  description: "用户修改系统配置"
  duration: "即时"
  USER_FEEDBACK:
    INFO: [statusbar]
  SYSTEM:
    INFO: [file, database]  # 配置变更入库（审计）
    ERROR: [ui_dialog]
  NOTIFICATION:
    INFO: [statusbar]

# 场景: 异常恢复
scenario_error_recovery:
  description: "系统异常恢复"
  duration: "1-5s"
  SYSTEM:
    WARNING: [file, console, database, event]
    ERROR: [file, console, database, ui_dialog, event]
    CRITICAL: [file, console, database, ui_dialog, event, email]
  ALERT:
    WARNING: [file, database, statusbar, event]
    ERROR: [file, database, statusbar, ui_dialog, event, email]

# 场景: 网络连接重试
scenario_connection_retry:
  description: "网络连接重试"
  duration: "持续"
  SYSTEM:
    WARNING: [file, statusbar]
    ERROR: [file, statusbar, ui_dialog]
  ALERT:
    WARNING: [file, statusbar]

# 场景: 数据库维护
scenario_database_maintenance:
  description: "数据库维护（清理/备份）"
  duration: "30-60s"
  SYSTEM:
    INFO: [file, console]
    WARNING: [file, console]
    ERROR: [file, console, ui_dialog]
  NOTIFICATION:
    INFO: [file, statusbar]

