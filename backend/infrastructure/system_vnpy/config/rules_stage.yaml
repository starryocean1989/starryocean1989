# 阶段规则（按生命周期阶段切换策略）

# 启动阶段 (5-10秒): 简洁输出，只显示关键节点
stage_startup:
  description: "系统启动和初始化阶段"
  duration: "5-10s"
  SYSTEM:
    DEBUG: [file, ai_file]  # ✅ 只输出到文件和AI日志
    INFO: [file, ai_file]  # ✅ 只输出到文件和AI日志
    WARNING: [file, console, database, event, ai_file]
    ERROR: [file, console, database, event, ai_file]
    CRITICAL: [file, console, database, event, ui_dialog, ai_file]

  STAGE_NODE:  # 🆕 流程节点
    DEBUG: [file, ai_file]  # ✅ 只输出到文件和AI日志
    INFO: [file, console, ai_file]  # ✅ 阶段节点输出到Terminal（用户需求）
    WARNING: [file, console, database, event, ai_file]
    ERROR: [file, console, database, event, ai_file]

  PROGRESS:
    DEBUG: [file, console, ai_file]  # ✅ 启动阶段全量输出到AI日志
    INFO: [file, ai_file]  # ✅ 进度不输出到terminal，但输出到AI日志
    WARNING: [file, console, ai_file]  # ✅ 启动阶段全量输出到AI日志

  NOTIFICATION:
    INFO: [file, console, event, ai_file]  # ✅ 启动阶段全量输出到AI日志
    WARNING: [file, console, database, ai_file]  # ✅ 启动阶段全量输出到AI日志

  ALERT:
    WARNING: [file, console, database, event, ai_file]  # ✅ 启动阶段全量输出到AI日志
    ERROR: [file, console, database, event, ai_file]  # ✅ 启动阶段全量输出到AI日志

  # 启动阶段的异常详细化
  ERROR:
    DEBUG: [file, ai_file]  # ✅ 启动阶段全量输出到AI日志
    INFO: [file, ai_file]  # ✅ 启动阶段全量输出到AI日志
    WARNING: [file, console, database, event, ai_file]  # ✅ 启动阶段全量输出到AI日志
    ERROR: [file, console, database, event, ai_file]  # ✅ 启动阶段全量输出到AI日志
    CRITICAL: [file, console, database, event, ui_dialog, ai_file]  # ✅ 启动阶段全量输出到AI日志

# 数据感知阶段 (10-30秒): 品种加载、缓存验证
stage_sensing:
  description: "数据感知和缓存验证阶段"
  duration: "10-30s"
  SYSTEM:
    INFO: [file, console, statusbar]
  PROGRESS:
    INFO: [file, event_throttled, statusbar]  # 进度显示在状态栏
  NOTIFICATION:
    INFO: [file, console, statusbar, event]
  ALERT:
    WARNING: [file, statusbar]

# 下载阶段 (1-3分钟): 进度静默，完成输出
stage_downloading:
  description: "批量数据下载阶段（高频日志）"
  duration: "1-3min"
  PROGRESS:
    DEBUG: [file, console]
    INFO: [file, event_throttled]  # 🎯 进度不输出到terminal
    WARNING: [file, console, event]
    ERROR: [file, console, database, event]

  STAGE_NODE:
    INFO: [file, console]  # 下载节点输出

  NOTIFICATION:
    INFO: [file, console, event]  # 🎯 下载完成输出
    WARNING: [file, console, database]

  ALERT:
    WARNING: [file, console, database, event]
    ERROR: [file, console, database, event, ui_dialog]

# 质量扫描阶段 (30-60秒): 进度+告警
stage_quality_scan:
  description: "数据质量扫描阶段"
  duration: "30-60s"
  PROGRESS:
    DEBUG: [file, console]
    INFO: [file, event_throttled]  # 🎯 进度不输出到terminal
    WARNING: [file, console]

  STAGE_NODE:
    INFO: [file, console]  # 扫描节点输出

  ALERT:
    WARNING: [file, console, database, ui_statusbar]  # 🎯 质量问题告警
    ERROR: [file, console, database, ui_statusbar, ui_dialog]

  NOTIFICATION:
    INFO: [file, console, event]  # 🎯 扫描完成输出

# 交易阶段 (持续运行): 全量记录，所有日志入库
stage_trading:
  description: "实盘交易阶段（关键阶段）"
  duration: "持续"
  priority: critical
  SYSTEM:
    DEBUG: [file, console]
    INFO: [file, database]  # 🎯 交易日志入库但不输出到terminal
    WARNING: [file, console, database, event]
    ERROR: [file, console, database, ui_dialog, event]

  STAGE_NODE:
    INFO: [file, console]  # 交易节点输出

  ALERT:
    WARNING: [file, console, database, ui_statusbar, event]
    ERROR: [file, console, database, ui_statusbar, ui_dialog, event, email]  # 交易告警发邮件
    CRITICAL: [file, console, database, ui_statusbar, ui_dialog, event, email, sms]  # 紧急告警发短信

  NOTIFICATION:
    INFO: [file, console, database, ui_statusbar]  # 🎯 交易通知输出

# 策略回测阶段 (1-5分钟): 进度监控
stage_backtest:
  description: "策略回测阶段"
  duration: "1-5min"
  PROGRESS:
    INFO: [file, event_throttled, statusbar]
  SYSTEM:
    INFO: [file]  # 回测细节仅文件
    WARNING: [file, console, event]
  NOTIFICATION:
    INFO: [file, statusbar, ui_dialog]  # 回测完成弹窗

# 监控阶段 (持续运行): 独立进程，ZMQ回传
stage_monitoring:
  description: "系统监控阶段（独立进程）"
  duration: "持续"
  SYSTEM:
    INFO: [file]
  ALERT:
    WARNING: [file, zmq_push, statusbar]  # 通过ZMQ推送到主进程
    ERROR: [file, zmq_push, statusbar, ui_dialog]
    CRITICAL: [file, zmq_push, statusbar, ui_dialog, email]

# 关闭阶段 (3-5秒): 清理日志
stage_shutdown:
  description: "系统关闭和清理阶段"
  duration: "3-5s"
  SYSTEM:
    INFO: [file, console]
    WARNING: [file, console, database]
    ERROR: [file, console, database]
  NOTIFICATION:
    INFO: [file, console]

