# -*- coding: utf-8 -*-
# =============================================================================
# 网络测速服务器配置 - 仅国内服务器
# =============================================================================
#
# 本配置文件定义了自研测速方案使用的公共测速站点
# 这些站点专门用于网络测速，允许高频访问，无限流风险
#
# 配置项说明：
#   name: 服务器名称
#   category: 分类（domestic）
#   ping_url: 用于延迟测试的URL（HEAD请求）
#   download_url: 用于下载速度测试的URL（GET请求，流式下载）
#   timeout: 超时时间（秒），可选，默认5秒
#   description: 描述信息
#   enabled: 是否启用，默认true
#
# =============================================================================

