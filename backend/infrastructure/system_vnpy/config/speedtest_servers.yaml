# =============================================================================
# 测速策略配置
# =============================================================================

strategy:
  # 服务器选择策略：random（随机选择）
  server_selection: "random"

  # 延迟测试超时时间（秒）
  ping_timeout: 5

  # 延迟测试最大重试次数
  ping_max_retries: 3

  # 带宽测试超时时间（秒）
  bandwidth_timeout: 15

  # 带宽测试最大重试次数
  bandwidth_max_retries: 3

  # 单次下载测速最大时长（秒）（10MB文件，建议15-20秒）
  max_download_duration: 20

# =============================================================================
# 用户自定义服务器（可选）
# =============================================================================
# 用户可以在此添加自己的测速服务器
# 格式与上面相同

custom_servers: []
  # 示例：
  # - name: "我的测速服务器"
  #   category: "domestic"
  #   ping_url: "http://my-server.com"
  #   download_url: "http://my-server.com/test.bin"
  #   timeout: 5
  #   description: "自定义测速服务器"
  #   enabled: true
