# -*- coding: utf-8 -*-
# =============================================================================
# 延迟测试服务器配置 - 门户网站池
# =============================================================================
#
# 本配置文件定义了延迟测试使用的门户网站、视频网站、体育网站等
# 用于日常网络延迟监控，使用GET请求+完整浏览器头部模拟真实用户访问
#
# 配置项说明：
#   name: 服务器名称
#   category: 分类（portal/video/sports/search/government/public_service）
#   ping_url: 用于延迟测试的URL（GET请求，模拟浏览器）
#   timeout: 超时时间（秒），默认5秒
#   description: 描述信息
#   enabled: 是否启用，默认true
#
# =============================================================================

servers:
