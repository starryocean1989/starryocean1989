# 全局默认规则（兜底规则，最低优先级）
# 所有未被阶段/模块/场景规则覆盖的日志使用此规则
#
# 🎯 优化策略（v4.1）：
# 1. DEBUG日志只写文件和AI日志，不输出到Terminal
# 2. INFO日志只写文件和AI日志，不输出到Terminal
# 3. Terminal只显示：阶段节点、完成通知、警告、错误
# 4. 所有日志完整保留在文件和AI日志中，方便AI分析

SYSTEM:
  DEBUG: [file, ai_file]  # ✅ DEBUG仅文件和AI日志
  INFO: [file, ai_file]  # ✅ INFO仅文件和AI日志，不输出到Terminal
  WARNING: [file, console, database, event, ai_file]  # ✅ WARNING输出到Terminal
  ERROR: [file, console, database, event, ai_file]  # ✅ ERROR输出到Terminal
  CRITICAL: [file, console, database, event, ui_dialog, ai_file]  # ✅ CRITICAL输出到Terminal并弹窗

# 🆕 流程节点日志类型（阶段开始/结束标记）
STAGE_NODE:
  DEBUG: [file, ai_file]  # ✅ 节点DEBUG仅文件和AI日志
  INFO: [file, console, ai_file]  # ✅✅ 关键：阶段节点INFO输出到Terminal（用户明确需求）
  WARNING: [file, console, database, event, ai_file]
  ERROR: [file, console, database, event, ai_file]
  CRITICAL: [file, console, database, event, ui_dialog, ai_file]  # ✅ CRITICAL级别补充

PROGRESS:
  DEBUG: [file, ai_file]  # ✅ 进度DEBUG仅文件和AI日志
  INFO: [file, event_throttled, ai_file]  # ✅ 进度INFO不输出到Terminal，通过事件节流
  WARNING: [file, console, event, ai_file]
  ERROR: [file, console, database, event, ai_file]

NOTIFICATION:
  INFO: [file, console, event, ui_statusbar, ai_file]  # ✅ 任务完成通知输出到Terminal
  WARNING: [file, console, database, event, ai_file]
  ERROR: [file, console, database, event, ai_file]

ALERT:
  WARNING: [file, console, database, ui_statusbar, event, ai_file]  # ✅ 告警输出到Terminal
  ERROR: [file, console, database, ui_statusbar, ui_dialog, event, ai_file]  # ✅ 错误告警输出到Terminal并弹窗
  CRITICAL: [file, console, database, ui_statusbar, ui_dialog, event, ai_file]

USER_FEEDBACK:
  INFO: [file, console, ui_statusbar, ai_file]  # ✅ 用户反馈输出到Terminal
  ERROR: [file, console, ui_dialog, ai_file]

DEBUG:
  DEBUG: [file, ai_file]  # ✅ DEBUG类型仅文件和AI日志

