# -*- coding: utf-8 -*-
[mypy]
python_version = 3.10
warn_return_any = False
warn_unused_configs = True
disallow_untyped_defs = False
check_untyped_defs = False
ignore_missing_imports = False
mypy_path = typings

# vnpy 核心包仍需忽略（我们只为扩展包创建了存根）
[mypy-vnpy.*]
ignore_missing_imports = True

# 忽略其他无类型支持的第三方库
[mypy-pyqtgraph.*]
ignore_missing_imports = True

[mypy-mootdx.*]
ignore_missing_imports = True

[mypy-pytdx.*]
ignore_missing_imports = True

[mypy-autopep8.*]
ignore_missing_imports = True

[mypy-apscheduler.*]
ignore_missing_imports = True

[mypy-PyQt6.*]
ignore_missing_imports = True

[mypy-websockets.*]
ignore_missing_imports = True

